name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release-notes*.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Test release notes
        run: node --test scripts/release-notes.test.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate release notes from commits
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its published notes."
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_TAG · 更新记录" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
